name: Code checking and unit testing

on:
  # main was never tested directly: the only trigger was a pull request, so
  # anything that reached main by another route — a merge whose checks had not
  # finished, a direct push — went unverified.
  push:
    branches: [ main ]
  # No branch filter. Restricting to `branches: [main]` skipped every stacked
  # pull request, because a PR based on another feature branch does not match.
  # Those are exactly the changes that most want checking before the base lands.
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The browser gets this many seconds to load the test module and report back.
  # The default 20s is measured against a debug wasm that grows with every
  # component, and a two-core runner is slower than any dev machine — the
  # components suite hit that ceiling and CI reported "Failed to detect test as
  # having been run" without a single test failing.
  WASM_BINDGEN_TEST_TIMEOUT: 120

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
      - name: wasm-bindgen-action
        # You may pin to the exact commit or the version.
        # uses: jetli/wasm-bindgen-action@370ddd977537b33f15fd1241476a90a1254dfdae
        uses: jetli/wasm-bindgen-action@v0.1.0
        with:
          # Optional version of wasm-bindgen to install (eg. "0.2.68", "latest").
          # Must match the wasm-bindgen version in Cargo.lock, or the
          # wasm test runner refuses the produced wasm artifacts.
          version: 0.2.105
      - name: rust-toolchain
        # You may pin to the exact commit or the version.
        # uses: actions-rs/toolchain@b2417cde72dcf67f306c0ae8e0828a81bf0b189f
        uses: actions-rs/toolchain@v1.0.6
        with:
          # Rust toolchain name.
          toolchain: stable
          target: wasm32-unknown-unknown
      - name: Chrome and driver versions
        run: |
          google-chrome --version || true
          /usr/local/share/chromedriver-linux64/chromedriver --version || true
          nproc; free -m; df -h /tmp | tail -1
      - name: Run chrome tests
        run: RUST_BACKTRACE=1 CHROMEDRIVER_ARGS="--verbose --log-path=/tmp/chromedriver.log" CHROMEDRIVER=/usr/local/share/chromedriver-linux64/chromedriver cargo test --target wasm32-unknown-unknown
      - name: Chromedriver log on failure
        if: failure()
        run: |
          echo "=== page-level events (console, exceptions, crashes, loading failures)"
          grep -aiE "consoleAPICalled|exceptionThrown|entryAdded|targetCrashed|targetDestroyed|loadingFailed|Runtime.exception" /tmp/chromedriver.log | head -60 || true
          echo "=== first 40kB of the driver log"
          head -c 40000 /tmp/chromedriver.log || true
      - name: Run firefox tests
        run: RUST_BACKTRACE=1 GECKODRIVER=$GECKOWEBDRIVER/geckodriver cargo test --target wasm32-unknown-unknown
      - name: clippy checks
        run: cargo clippy
      - name: Run unit tests
        run: cargo test
