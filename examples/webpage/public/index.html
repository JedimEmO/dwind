<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="dwind — compile-time utility styling and the DWUI component library for Rust + DOMINATOR. Type-safe, reactive, no CSS build pipeline.">
    <meta charset="utf-8">
    <link data-trunk rel="rust" href="../Cargo.toml">
    <title>dwind — styling forged at compile time</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23020203'/%3E%3Cpath d='M9 22 L16 8 L23 22' stroke='%23D5B65F' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style type="text/css">
        :root {
            color-scheme: dark;
        }

        html {
            background-color: #020203;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: 'IBM Plex Sans', sans-serif;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
        }

        .font-display {
            font-family: 'Bricolage Grotesque', 'IBM Plex Sans', sans-serif;
        }

        .font-code {
            font-family: 'JetBrains Mono', monospace;
        }

        ::selection {
            background-color: #D5B65F;
            color: #020203;
        }

        /* Firefox scrollbars; the WebKit equivalent lives in styles.rs */
        * {
            scrollbar-color: #26262C transparent;
            scrollbar-width: thin;
        }

        /* One focus treatment for every custom control on the site. */
        :focus-visible {
            outline: 2px solid #D5B65F;
            outline-offset: 2px;
            border-radius: 4px;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                transition-delay: 0ms !important;
            }
        }
    </style>
</head>
</html>
