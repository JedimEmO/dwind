[workspace]
resolver = "2"
members = [
    "crates/dominator-css-bindgen",
    "crates/dwind",
    "crates/dwind-base",
    "crates/dwind-build",
    "crates/dwind-macros",
    "crates/dwind-dviz",
    "crates/dwind-dviz-core",
    "crates/dwind-dviz-data",
    "crates/dwui",
    "crates/example-html-macro",
    "crates/modern-normalize-cssys",
    "crates/tests/dominator-css-bindgen-test",
    "examples/webpage",
]

# Shared package metadata for the crates that opt in with `.workspace = true`
# (the dwind-dviz family). The older crates keep their own fields.
[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/JedimEmO/dwind"
homepage = "https://jedimemo.github.io/dwind/examples"
keywords = ["web", "wasm", "chart", "visualization", "dominator"]
categories = ["visualization", "wasm", "web-programming"]

[workspace.dependencies]
case = "1.0"
dwind-dviz = { path = "crates/dwind-dviz", version = "0.1.0" }
dwind-dviz-core = { path = "crates/dwind-dviz-core", version = "0.1.0" }
dwind-dviz-data = { path = "crates/dwind-dviz-data", version = "0.1.0" }
jiff = { version = "0.2", features = ["js"] }
js-sys = "0.3"
const_format = "0.2"
cssparser = "0.34"
dominator = "0.5"
futures = "0.3"
futures-signals = "0.3"
futures-signals-component-macro = { version = "0.4.0", features = [
    "dominator",
] }
gloo-timers = { version = "0.3.0", features = ["futures"] }
log = "0.4"
matchit = "0.8"
nom = "7.1"
once_cell = "^1.19"
prettyplease = "0.2"
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = "2.0"
syntect = { version = "5.2", default-features = false, features = [
    "default-fancy",
    "default-syntaxes",
    "default-themes",
] }
thiserror = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
wasm-log = "0.3"
web-sys = { version = "0.3", features = [
    "DomRect",
    "Element",
    "Navigator",
    "Url",
    "Window",
    "HtmlSelectElement",
] }

# Debug info dominates a wasm test binary: the components suite compiled to
# 149 MB with full debug info, of which only ~3 MB was code. Line tables keep
# panic backtraces pointing at real files and lines while taking the binary to
# 28 MB, so every browser test run fetches and instantiates a fifth of the
# bytes.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
